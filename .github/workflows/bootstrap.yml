name: 初始化股票池项目
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压网站源码
        run: unzip -o stock-pool-free-github-pages-final.zip -x .github/workflows/update-stock-pool.yml
      - name: 提交网站源码
        run: |
          git config user.name "stock-pool-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize stock pool site"
          git push

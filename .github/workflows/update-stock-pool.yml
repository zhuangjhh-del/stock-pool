name: 更新股票池
on:
  schedule:
    - cron: "15 7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: stock-pool-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 执行选股（内置 3 次重试）
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/run_selection.py
      - name: 保存结果、历史与日志
        if: always()
        run: |
          git config user.name "stock-pool-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data logs
          git diff --cached --quiet || git commit -m "data: update stock pool"
          git push
      - name: 失败告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `股票池更新失败：${new Date().toISOString().slice(0, 10)}`,
              body: `自动任务失败。请查看运行日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation-failure']
            })
